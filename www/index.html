<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Demo Announcements</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <h1>Demo Announcements</h1>
  <p>Push notifications demo (works when app is closed).</p>

  <script type="module">
    import { PushNotifications } from "@capacitor/push-notifications";

    async function initPush() {
      try {
        await PushNotifications.requestPermissions();
        await PushNotifications.register();

        PushNotifications.addListener("registration", function (token) {
          window.alert("Push token:" + String.fromCharCode(10) + token.value);
        });

        PushNotifications.addListener("pushNotificationReceived", function (notification) {
          window.alert("Notification received:" + String.fromCharCode(10) + JSON.stringify(notification, null, 2));
        });

        PushNotifications.addListener("pushNotificationActionPerformed", function (action) {
          window.alert("You tapped:" + String.fromCharCode(10) + action.notification.title);
        });
      } catch (err) {
        window.alert("Push init error:" + String.fromCharCode(10) + (err?.message || JSON.stringify(err, null, 2)));
      }
    }

    initPush();
  </script>
</body>
</html>
