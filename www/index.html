<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Demo Announcements</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <h1>Demo Announcements</h1>
  <p>Push notifications demo (works when app is closed).</p>

  <script type="module">
    import { PushNotifications } from '@capacitor/push-notifications';

    async function initPush() {
      try {
        await PushNotifications.requestPermissions();
        await PushNotifications.register();

        PushNotifications.addListener('registration', token => {
          window.alert('Push token:
' + token.value);
        });

        PushNotifications.addListener('pushNotificationReceived', notification => {
          window.alert('Notification received:
' + JSON.stringify(notification, null, 2));
        });

        PushNotifications.addListener('pushNotificationActionPerformed', action => {
          window.alert('You tapped:
' + action.notification.title);
        });
      } catch (err) {
        window.alert('Push init error:
' + (err?.message || JSON.stringify(err, null, 2)));
      }
    }

    initPush();
  </script>
</body>
</html>
