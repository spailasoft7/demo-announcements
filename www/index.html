<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo Announcements</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>Demo Announcements</h1>
  <p id="status">Starting push notification test…</p>

  <script>
    function show(message) {
      document.getElementById("status").textContent = message;
      window.alert(message);
    }

    async function initPush() {
      try {
        show("JavaScript started");

        if (!window.Capacitor) {
          show("ERROR: Capacitor bridge is missing");
          return;
        }

        const PushNotifications = window.Capacitor.Plugins.PushNotifications;

        if (!PushNotifications) {
          show("ERROR: PushNotifications plugin is missing");
          return;
        }

        show("Push plugin found");

        const permission = await PushNotifications.requestPermissions();
        show("Permission: " + permission.receive);

        if (permission.receive !== "granted") {
          show("Notifications were not allowed. Enable them in Android Settings.");
          return;
        }

        await PushNotifications.addListener("registration", function(token) {
          show("Push token: " + token.value);
        });

        await PushNotifications.addListener("registrationError", function(error) {
          show("Registration error: " + JSON.stringify(error));
        });

        await PushNotifications.addListener("pushNotificationReceived", function(notification) {
          show("Notification received: " + JSON.stringify(notification));
        });

        await PushNotifications.addListener("pushNotificationActionPerformed", function(action) {
          show("Notification tapped: " + JSON.stringify(action));
        });

        await PushNotifications.register();
        show("Registration requested — wait a few seconds for token");
      } catch (error) {
        show("Push error: " + (error.message || JSON.stringify(error)));
      }
    }

    window.addEventListener("load", initPush);
  </script>
</body>
</html>
